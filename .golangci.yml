version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    paths:
      - web
    rules:
      # Comments follow the project policy (see AGENTS.md): own format for functions, none for interfaces.
      - linters: [revive]
        text: "comment on exported|should have comment"
formatters:
  enable:
    - gofmt
