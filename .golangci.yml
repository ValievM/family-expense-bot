version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    paths:
      - web
    rules:
      # Comment style: own three-line format for functions, none for interfaces (revive "exported" is off).
      - linters: [revive]
        text: "comment on exported|should have comment"
formatters:
  enable:
    - gofmt
