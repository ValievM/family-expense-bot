version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # Function comments follow the project format (Принимает/Делает/Возвращает), not the "Name ..." form.
      - linters: [revive]
        text: "comment on exported"
formatters:
  enable:
    - gofmt
