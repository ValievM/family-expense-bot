openapi: 3.0.3
info:
  title: Family Expenses API
  version: 1.0.0
  description: |
    REST API behind the family head's web panel. There is no authentication by design.
    Money is always an integer number of kopecks (`35000` means 350.00 RUB).
    Dates are calendar days in the configured time zone, formatted `YYYY-MM-DD`.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/categories:
    get:
      summary: Closed list of expense categories with display labels
      responses:
        "200":
          description: Categories in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
  /api/users:
    get:
      summary: Family members that have at least one expense
      responses:
        "200":
          description: Distinct owners in ascending order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /api/expenses:
    get:
      summary: List expenses of the whole family, newest first
      parameters:
        - { name: user_id, in: query, schema: { type: integer, format: int64 }, description: Telegram ID of the owner }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/CategoryKey" } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Inclusive start day }
        - { name: to, in: query, schema: { type: string, format: date }, description: Inclusive end day }
      responses:
        "200":
          description: Matching expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseList"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Create an expense for any family member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpense"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      summary: Partially update an expense; absent fields stay unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpense"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an expense
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  responses:
    BadRequest:
      description: Validation or parsing error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Expense does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CategoryKey:
      type: string
      enum: [food, transport, housing, entertainment, health, shopping, other]
    Expense:
      type: object
      required: [id, user_id, amount, category, category_label, spent_at, comment, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: Kopecks, minimum: 1 }
        category: { $ref: "#/components/schemas/CategoryKey" }
        category_label: { type: string, example: еда }
        spent_at: { type: string, format: date }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateExpense:
      type: object
      additionalProperties: false
      required: [user_id, amount, category]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        amount: { type: integer, format: int64, description: Kopecks, minimum: 1 }
        category: { $ref: "#/components/schemas/CategoryKey" }
        spent_at: { type: string, format: date, description: Defaults to today }
        comment: { type: string }
    UpdateExpense:
      type: object
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        category: { $ref: "#/components/schemas/CategoryKey" }
        spent_at: { type: string, format: date }
        comment: { type: string, description: Empty string clears the comment }
    ExpenseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { $ref: "#/components/schemas/CategoryKey" }
              label: { type: string }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [user_id, name, username]
            properties:
              user_id: { type: integer, format: int64 }
              name: { type: string, description: Display name from the Telegram profile; empty string if unknown }
              username: { type: string, description: Telegram username without @; empty string if unknown }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_id, invalid_user, invalid_amount, invalid_date, invalid_period, unknown_category, comment_too_long, not_found, internal]
            message: { type: string }
